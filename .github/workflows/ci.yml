name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this, every job inherits the
# repository default scope, which is write-all on repos created before the
# read-only default shipped. Nothing here needs more than checkout: `publish`
# declares its own `id-token: write` for npm provenance and overrides this.
# CodeQL actions/missing-workflow-permissions, issue #7.
permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-node-${{ matrix.node-version }}
          path: |
            npm-debug.log
            tests/
          retention-days: 14

  burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Burn-in loop (5 iterations)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Burn-in iteration $i/5 ==="
            npm test || exit 1
            npm run test:integration || exit 1
          done
          echo "=== All 5 burn-in iterations passed ==="

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  agent-surface-parity:
    # Replaces the retired M9 PF1 behavioural-equivalence gate (ADR-001, 2026-08-13).
    # PF1 required ~6 hr of manual capture per release and could not separate signal from
    # noise; this runs in seconds on every push, covers 12 agents instead of 4, and fails
    # loudly when an agent or menu code disappears.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Needs history + tags: the check compares the last release tag against HEAD, and
          # the default shallow clone has neither.
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Agent surface parity vs last release tag
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "::warning::No v* tag found — skipping parity check (nothing to compare against)."
            exit 0
          fi
          echo "Comparing $BASE -> HEAD"
          node scripts/audit/agent-surface-parity.js "$BASE" HEAD

      - name: Install scope containment
        run: node scripts/audit/install-scope-check.js

      # Twice now a commit has deleted backlog rows while claiming to repair them (c841fcd2
      # dropped BUG-16; 3a3de195 dropped T35 and T39, one of them an open risk item). Both
      # times every check stayed green. Specified by BUG-16, built after the second occurrence.
      # T79 added a warn-level owed-close scan that reads `git log`. It is deliberately in
      # THIS job because this job already has full history — but note the `fetch-depth: 0`
      # above is justified by the PARITY step, not by this one. If that step ever goes away,
      # keep the fetch-depth or this scan silently finds nothing. It reports when it cannot
      # run rather than reporting clean, so the failure is visible either way.
      - name: Backlog referential integrity
        run: node scripts/audit/backlog-integrity.js

      - name: Documentation audit
        # T32: `docs:audit` has existed and passed for months while running in no workflow.
        # It was FAILING when discovered (8 broken paths across all 7 shipped Vortex user
        # guides, every one pointing at the pre-v4 flat agent layout); the paths were fixed
        # by hand and nothing has watched them since. A check that exists but is not enforced
        # is indistinguishable from no check.
        #
        # Placed in this job deliberately: it is the audit aggregator (install-scope,
        # backlog integrity) and it is in `publish.needs`, so a broken link in a SHIPPED user
        # guide blocks a release. That is the intended severity — these files go in the tarball.
        run: npm run docs:audit

      - name: Vortex pacing footers
        # oc-2-1. The OC-R7 `Concept count: N/3` footers in the Vortex step-01 files are a human
        # judgement under a rubric with inheritance, so nothing could check them — and they were
        # wrong twice in a row: once as authored, once after a full review round recounted every
        # one of them. `code-review-convergence` calls two failed attempts at the same fix a
        # restructure signal, and this check is that restructure.
        #
        # It does not compute the count (semantic, and a script cannot). It asserts what IS
        # mechanical and was individually a real defect in this story: rounds == footers ==
        # literal halt markers, each footer's number matching the concepts it names, nothing over
        # budget, no contract-schema enumeration reintroduced, the fallback sentence ahead of its
        # boundary rather than behind it, and every `## Next Step` pointer resolving.
        #
        # Its inheritance check is a stderr WARNING that never affects the exit code, per the
        # `preflight-soft-warn` convention — as a hard gate it produced 13 findings that were
        # mostly false and missed the one defect it was written for.
        #
        # Verified by mutation before wiring: over-budget footer, count disagreeing with its own
        # list, a dropped halt marker, a fallback moved behind the boundary, and a restored schema
        # enumeration each produce exit 1; the unmutated tree exits 0.
        run: npm run audit:pacing

      - name: Agent manifest bme rows match the registry
        # T74. Until story gen-1.1 (`7b957dbf`), every `npm test` run regenerated
        # `_bmad/_config/agent-manifest.csv`, so a registry edit made without a
        # regeneration showed up as a dirty working tree. That accident was the only
        # thing keeping the tracked manifest in sync, and gen-1.1 removed it on
        # purpose — the whole point of the story was that running the tests must not
        # rewrite a tracked file. Its absence was confirmed by execution: delete one
        # bme row and every other gate stays green.
        #
        # SCOPE — this covers the 12 `bme` rows ONLY, and the step name says so.
        # `generateAgentManifest` reads the existing file for its header and its
        # `preservedRows` (every row whose module column is not `bme`) and writes them
        # straight back, so the header and the 41 upstream rows are compared against
        # themselves and can never differ. Measured: strip all 41 upstream rows, commit,
        # run this step -> GREEN. Filed as T78.
        #
        # An earlier version of this comment said that detecting the loss "needs a
        # before/after count inside a refresh, not a regenerate-and-diff". Round 2
        # corrected that: the loss lands IN HEAD, so there is no before to compare
        # against — a static floor (assert at least N non-bme rows, the shape
        # scripts/audit/install-scope-check.js:93 already uses for write-op counts)
        # would catch it in this same step. T78 should take that shape.
        #
        # Why `git diff` is honest here, stated precisely because an earlier version of
        # this comment got it wrong: gen-1.1's spec proposed this command in its R2 and
        # R3 rejected it — not because the diff's subject was wrong but because the
        # GENERATOR could be pointed at another root,
        # leaving the tracked file untouched and the diff green. That is impossible for
        # this entry: `scripts/generate-manifest.js` derives its target from
        # `path.resolve(__dirname, '..')`, so it can only ever write this repo's own
        # manifest. Demonstrated red before being relied on — editing an agent's title
        # in `agent-registry.js` without regenerating turns this step red.
        run: |
          # The manifest must be TRACKED. `git diff HEAD -- <path>` reports nothing for
          # a path absent from HEAD, and the generator recreates the file — so a deleted
          # or untracked manifest made this step print success while its own subject did
          # not exist. Found by Round 2; inherited from the first draft, not introduced.
          if ! git ls-files --error-unmatch -- _bmad/_config/agent-manifest.csv >/dev/null 2>&1; then
            echo "::error::_bmad/_config/agent-manifest.csv is not tracked in HEAD. It is a committed, generated file — restore it and run 'npm run generate:manifest'."
            exit 1
          fi

          if ! GEN_OUT=$(npm run generate:manifest 2>&1); then
            echo "$GEN_OUT"
            echo "::error::npm run generate:manifest failed — the manifest could not be regenerated, so drift could not be checked."
            exit 1
          fi
          echo "$GEN_OUT"

          # Assert the generator actually WROTE. Exit code alone cannot distinguish
          # "regenerated and matched" from "did not regenerate at all", which is the
          # tautology class gen-1.1's spec rejected three times — and the shape is live
          # in this codebase: agent-manifest-generator.js has a SKIP_MESSAGE branch that
          # returns success without writing. Found by Round 2.
          if ! printf '%s' "$GEN_OUT" | grep -q 'Regenerated agent-manifest.csv'; then
            echo "::error::generate:manifest reported success without regenerating (no 'Regenerated agent-manifest.csv' in its output). The drift check would have been vacuous."
            exit 1
          fi
          # `git diff HEAD`, not `git diff`: the bare form compares worktree to INDEX,
          # so anything that stages the file would make this pass while real drift sits
          # in the index.
          if ! git diff HEAD --quiet -- _bmad/_config/agent-manifest.csv; then
            echo "::error::agent-manifest.csv bme rows do not match agent-registry.js. Run 'npm run generate:manifest' and commit the result."
            echo "--- drift ---"
            git --no-pager diff HEAD --stat -- _bmad/_config/agent-manifest.csv
            git --no-pager diff HEAD -- _bmad/_config/agent-manifest.csv
            exit 1
          fi
          echo "agent-manifest.csv bme rows match the registry."


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify npm pack contents
        run: npm pack --dry-run 2>&1 | tee pack-output.txt

      - name: Check index.js runs
        run: node index.js

  fresh-install:
    # Backlog T25. Packs the tree, installs THAT TARBALL into a throwaway project, and runs what
    # a new user runs: convoke-install-vortex, convoke-doctor, a real convoke-export, and a launch
    # check on every declared bin.
    #
    # WHY A SEPARATE JOB FROM package-check. `package-check` runs `npm pack --dry-run` and
    # `node index.js` from inside this repo, so it only ever proves the code works HERE. Three
    # defects in one week passed the entire test suite and both of those checks:
    #
    #   I135  convoke-export resolved a packaged template from the USER's project root, so it
    #         failed in every project except this one.
    #   I137  a clean install failed its own convoke-doctor check with 3 errors, one of which
    #         told the user to run a command that does not exist for them.
    #   I139  convoke-export exited 4 on every fresh install — the manifest it reads never shipped.
    #
    # Each was found by packing and installing by hand. `--help` succeeded and doctor exited 0 for
    # I139, so neither a launch smoke nor the health check would have caught it — only invoking
    # real work did.
    #
    # No `npm ci`: the script needs no repo dependencies (verified against a clean clone). NOTE
    # this holds only while package.json has no `prepack`/`prepare` script — `npm pack` fires
    # both. `postinstall` is the only hook left and does not fire on pack; `prepublishOnly` was removed with the badges pipeline (ADR-001/dist-1-1) and never fired on pack either. If you add `prepare`,
    # this job needs `npm ci` or it breaks with a missing-devDependency error whose cause is a
    # comment in another file.
    #
    # Bash and ubuntu-only by design; Windows install behaviour is tracked separately as I128.
    # Node 20 only, against `engines: >=18` — install-time code has the narrowest version coverage
    # in this workflow. Widening to the 18/20/22 matrix is tracked in the backlog rather than done
    # here, because it triples the cost of the slowest-to-start job for a thin marginal return.
    runs-on: ubuntu-latest
    # The critical path is an UNCACHED registry install (no `npm ci`, no `cache: 'npm'`), which is
    # the most stall-prone step in the workflow. Without a ceiling a hang burns the 6-hour default
    # while `concurrency.cancel-in-progress` holds the ref's group — the trail-erasing dynamic
    # backlog I105 blames for a 4-day invisible red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # The script exits 2 for a harness/environment failure (registry blip, missing tarball) and
      # 1 for a real product defect. NOTE the workflow cannot act on that distinction — `run:`
      # collapses both into a failed step — so it is a signal for whoever reads the log, not an
      # automated one. A transient registry failure therefore blocks a tag publish exactly as a
      # real defect would, recoverable by re-running the job (R2 review 2026-08-14).
      - name: Fresh-install smoke (pack → install → doctor → export)
        id: smoke
        run: bash scripts/audit/try-fresh-install.sh

      # This job fails on defects that BY CONSTRUCTION do not reproduce in-repo, and the script
      # deletes its temp project on exit. Without this, a maintainer gets a bare exit code and
      # `KEEP=1` is advice they cannot act on in CI.
      # `!cancelled()` rather than `failure()`: a job that hits `timeout-minutes` counts as
      # CANCELLED for step conditions, so `failure()` skips the upload in exactly the hang case
      # where a partial log is most useful. `warn` rather than `ignore` so "we produced no logs"
      # is visible in the run annotations instead of being indistinguishable from a broken path
      # (R2 review 2026-08-14).
      - name: Upload install logs on failure
        if: ${{ !cancelled() && (failure() || steps.smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: fresh-install-logs
          path: .fresh-install-logs/
          retention-days: 14
          if-no-files-found: warn

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytest pyyaml ruff

      - name: Lint Python files
        run: ruff check _bmad/ --config ruff.toml

      # Enumerate mechanically rather than hardcoding paths: BMAD updates move,
      # rename, and retire skill directories wholesale (a16fa340 .bak'd the entire
      # BMB/core Python surface and relocated bmad-distillator under core/skills/),
      # which turned a stale path list into `pytest: exit 4` for six weeks.
      # See project-context.md rule `mechanical-research-enumeration`.
      - name: Run Python tests (BMB + Core)
        run: |
          # read loop rather than `mapfile`: mapfile is a bash 4+ builtin, so it
          # cannot be simulated locally on macOS (bash 3.2). Keep this step
          # runnable on a dev machine — an unverifiable CI step is how this
          # enumeration rotted unnoticed in the first place.
          #
          # `find`'s exit status is covered by the workflow-level `bash -eo pipefail`
          # (see `defaults.run.shell`): in a pipeline, pipefail propagates a non-zero
          # `find` and `-e` aborts the step. An earlier revision added an explicit
          # `FIND_STATUS=$?` check here — it was DEAD CODE twice over: `$?` after a
          # pipeline reports `sort`, not `find`, and pipefail had already aborted before
          # the check could run. Removed rather than "fixed", because the correct
          # behaviour was already in place; only the comment was wrong.
          # (project-context.md `verification-pipefail`.)
          #
          # `*.bak/*` excludes .bak'd DIRECTORIES. It is deliberately not redundant with
          # the name patterns: a16fa340 renamed .py files to .py.bak (which the patterns
          # already miss), but a future update that .bak's a whole `tests/` directory
          # would otherwise resurrect retired suites.
          find _bmad -type f \
            \( -name 'test_*.py' -o -name 'test-*.py' -o -name '*_test.py' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.venv/*' \
            -not -path '*/__pycache__/*' \
            -not -path '*/_archive/*' \
            -not -path '*.bak/*' \
            | sort > /tmp/py-tests.txt

          PY_TESTS=()
          while IFS= read -r f; do PY_TESTS+=("$f"); done < /tmp/py-tests.txt

          # Zero-floor guard, kept ALONGSIDE the baseline diff rather than replaced by it.
          # The baseline is only as strong as its own contents, and its update procedure
          # tells maintainers to delete lines. If it were ever emptied, `MISSING` and
          # `EXTRA` would both be empty and `pytest "${PY_TESTS[@]}"` would expand to a
          # bare `pytest` — which, with no pytest.ini/pyproject/setup.cfg in this repo,
          # recurses the entire tree. Two lines to prevent that.
          if [ "${#PY_TESTS[@]}" -eq 0 ]; then
            echo "::error::No Python test files discovered under _bmad/ — enumeration is broken."
            exit 1
          fi

          echo "Discovered ${#PY_TESTS[@]} Python test file(s):"
          printf '  %s\n' "${PY_TESTS[@]}"

          # A zero-floor guard only catches TOTAL annihilation. The regression that
          # actually happened was 5 files -> 1, which passed silently. Diff discovery
          # against the committed baseline so a PARTIAL collapse fails loudly.
          grep -vE '^\s*(#|$)' .github/expected-python-tests.txt | sort > /tmp/py-expected.txt
          MISSING=$(comm -23 /tmp/py-expected.txt /tmp/py-tests.txt)
          if [ -n "$MISSING" ]; then
            echo "::error::Expected Python test files were not discovered:"
            echo "$MISSING" | sed 's/^/  /'
            echo "If upstream legitimately retired them, remove them from .github/expected-python-tests.txt in the same commit, with the reason."
            exit 1
          fi
          EXTRA=$(comm -13 /tmp/py-expected.txt /tmp/py-tests.txt)
          if [ -n "$EXTRA" ]; then
            echo "::warning::New Python test files discovered (not yet in the baseline):"
            echo "$EXTRA" | sed 's/^/  /'
          fi

          # --import-mode=importlib: there is no __init__.py under _bmad/, so pytest's
          # default prepend mode derives module names from basenames — two same-named
          # files in different trees would collide with "import file mismatch" and fail
          # collection on an error unrelated to any test. No such duplicate exists today
          # (the second test_analyze_sources.py is a .py.bak the patterns never match);
          # this is pre-emptive, because the tree already contains the .bak twin that a
          # restore would activate.
          python -m pytest --import-mode=importlib "${PY_TESTS[@]}" -v

  # T49(a): the FR5 comparison has never executed on a runner -- dist-1-6's rehearsal
  # published a prerelease, so the guard took its skip branch. This job runs the SAME
  # script the publish job calls, over a fixture matrix, on every push and PR.
  #
  # It cannot publish, by construction: it is absent from `publish.needs`, declares no
  # `id-token` permission, and downgrade-guard.sh makes no network call of any kind.
  # It does NOT exercise the E404 anchor (that needs npm's stderr, which needs a network
  # read) -- the anchor is proven by fixture only, in the story's Task 2/3 record.
  downgrade-guard-dry:
    name: Downgrade guard (dry)
    # NOT on tag pushes. The workflow's `on:` includes `tags: ['v*']`, and without this the dry
    # job would run on a release tag -- where a red dry job would redden a run whose publish
    # SUCCEEDED, feeding T47's "run status is not evidence of registry state".
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Parity with the publish job's toolchain, so the two callers of
          # downgrade-guard.sh are not on divergent shells/coreutils.
          node-version: '24'
      - name: Exercise the comparison over a case matrix
        run: |
          fail=0
          # $4 (optional): substring the failure MUST contain. Without it a case asserts only
          # OK-vs-FATAL, and a FATAL reached via the wrong branch counts as a pass -- measured:
          # with the shape checks reverted to their loose form, 4.01.0-vs-4.1.0 and
          # 4.0.1-vs-4.1.00 still FATAL, via the DOWNGRADE branch, and sail through the very
          # regression they exist to catch.
          run_case() {
            want="$3"; because="${4:-}"
            if out=$(GUARD_CAND="$1" GUARD_CURRENT="$2" GUARD_PKG=convoke-agents \
                     ./scripts/ci/downgrade-guard.sh 2>&1); then got=OK; else got=FATAL; fi
            printf 'Downgrade guard (dry): %-9s vs %-9s -- %-5s (want %-5s)\n' "$1" "$2" "$got" "$want"
            if [ "$got" != "$want" ]; then echo "  MISMATCH: $out"; fail=1; fi
            if [ -n "$because" ]; then
              case "$out" in
                *"$because"*) ;;
                *) echo "  WRONG REASON: expected '$because', got: $out"; fail=1 ;;
              esac
            fi
          }
          run_case 4.0.0  4.0.0  OK
          run_case 4.0.1  4.0.0  OK
          run_case 3.3.1  4.0.0  FATAL
          run_case 4.10.0 4.9.0  OK
          run_case 4.9.0  4.10.0 FATAL
          run_case 10.0.0 9.9.9  OK
          run_case 4.0.2  4.0.10 FATAL
          # AC5's required zero-padded cases. These are the ONLY inputs on which BSD and GNU
          # version-sort could disagree, so they are the only cases with information content
          # about the runner. They must FATAL on the SHAPE CHECK, never reach `sort -V`.
          run_case 4.01.0 4.1.0  FATAL "is not a plain X.Y.Z release"
          run_case 4.0.1  04.0.0 FATAL "is not a plain X.Y.Z release"
          run_case 4.0.1  4.1.00 FATAL "is not a plain X.Y.Z release"
          echo "--- contract checks ---"
          # Assert the script is actually there. `if ! cmd` is true when the file is MISSING,
          # so a bare non-zero-exit assertion below would pass on a deleted script.
          test -x ./scripts/ci/downgrade-guard.sh || { echo "MISSING: downgrade-guard.sh"; fail=1; }
          # Match on the MESSAGE, not merely on a non-zero exit -- otherwise these pass for any
          # failure reason at all, including the script not existing.
          out=$(GUARD_CAND=4.0.1 GUARD_CURRENT="" ./scripts/ci/downgrade-guard.sh 2>&1) || true
          case "$out" in
            *"returned an EMPTY 'latest'"*) echo "empty CURRENT -- aborts for the right reason, OK" ;;
            *) echo "MISMATCH: empty CURRENT gave: $out"; fail=1 ;;
          esac
          out=$(GUARD_CAND=4.0.1-rc.0 GUARD_CURRENT=4.0.0 ./scripts/ci/downgrade-guard.sh 2>&1) || true
          case "$out" in
            *"is not a plain X.Y.Z release"*) echo "non-X.Y.Z CAND -- aborts for the right reason, OK" ;;
            *) echo "MISMATCH: non-X.Y.Z CAND gave: $out"; fail=1 ;;
          esac
          exit $fail

  publish:
    needs: [lint, test, python-test, coverage, security, package-check, agent-surface-parity, fresh-install]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # FR5/dist-1-3: a FIXED group name, deliberately not keyed to github.ref. The workflow-level
    # concurrency group is per-ref, so two tags pushed together run concurrently, both read the
    # pre-publish `latest`, both pass the downgrade guard, and the later-finishing one moves
    # `latest` backwards. Serialising every publish closes that check-to-use window.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Node 24 (npm >= 11.5.1) is REQUIRED, not a preference. npm's OIDC *registry
      # authentication* (`lib/utils/oidc.js`) first ships in npm 11.5.x. Node 20 bundles
      # npm 10.8.2, where that file does not exist and `publish.js` contains zero oidc
      # references — so with no token in the environment it publishes ANONYMOUSLY and the
      # registry answers 404 (npm returns 404, not 403, for unauthorised writes; it hides
      # package existence). That is exactly how 4.0.0 failed four times while appearing to
      # work: provenance SIGNING is a separate, older feature (npm >= 9.5), so every run
      # signed a Sigstore statement and looked authenticated right up to the write.
      # If you pin Node down again, restore the token or this job publishes as nobody.
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          # FR4/dist-1-5: `registry-url:` REMOVED deliberately. It did THREE things, and the
          # mechanism recorded in T41(d) and in this story's first draft was wrong about all of
          # them -- corrected here against setup-node's own source (src/authutil.ts, v5 tag):
          #   1. wrote `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a userconfig
          #   2. exported NPM_CONFIG_USERCONFIG pointing at it            (authutil.ts:53)
          #   3. exported NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX'      (authutil.ts:55-57)
          # (it also writes `always-auth=false`). So NODE_AUTH_TOKEN was NOT unset -- setup-node
          # set it -- and npm did NOT send an unexpanded literal: it sent the 23-character dummy
          # `XXXXX-XXXXX-XXXXX-XXXXX`. T41(d) called it "the literal 14-character string"; the
          # literal is 18 characters and was never on the wire. The remedy is unchanged and is
          # now MORE justified: removing the key removes all three effects and genuinely leaves
          # NODE_AUTH_TOKEN unset. Verified against npm 11.11.0's source that this is safe:
          # publish.js:139 takes the registry from `npmFetch.pickRegistry(resolved, opts)`, i.e.
          # npm's own config, NOT from setup-node; convoke-agents is unscoped and package.json
          # has no publishConfig, so pickRegistry falls through to the default
          # https://registry.npmjs.org/, and oidc.js derives its audience as
          # `npm:${new URL(registry).hostname}` from that same value. Audience and exchange URL
          # are byte-identical with or without this key. The guard below asserts the outcome
          # rather than trusting setup-node to keep behaving this way.

      - name: Install dependencies
        run: npm ci

      # Publishes via npm Trusted Publishing (OIDC), not a stored token. GitHub mints a
      # short-lived identity from the `id-token: write` permission above; npm verifies it
      # against the trusted-publisher entry registered for this repo + workflow.
      #
      # Deliberately NO `env: NODE_AUTH_TOKEN`. A token in the environment takes precedence
      # over OIDC, which put 4.0.0 back on the token path — and npm is restricting tokens
      # that bypass 2FA (https://gh.io/npm-gat-bypass2fa-deprecation), so every token variant
      # failed with EOTP regardless of account or package mfa settings.
      # BUG-15: this job fires on ANY `refs/tags/v*`, including `v4.1.0-rc.1`. `npm publish`
      # with no `--tag` applies `latest`, which would hand every existing user a release
      # candidate. Derive the tag from the version instead: a `-` in the semver AFTER stripping
      # `+build` metadata means prerelease -> `rc`; all else -> `latest`. FR1/dist-1-2: keep the strip.
      #
      # `--loglevel verbose` is deliberate: npm's oidc() is written to never throw and logs
      # every failure path at verbose/silly, so a trusted-publisher mismatch otherwise
      # surfaces as a bare auth error. This job only runs on a tag push, so each diagnosis
      # costs a tag delete-and-repush. Keep it until a green publish exists on a prerelease
      # tag as well as a stable one.
      - name: Publish to npm
        # FR3/dist-1-4: `github.ref_name` reaches the shell as an ENV VAR, never interpolated
        # into the `run:` body. Splicing a context value into a shell script is the Actions
        # code-injection pattern CodeQL scans for; via env: it arrives as data that can be
        # quoted. This is the first env: block in this workflow -- Stories 1.5-1.7 copy it.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # FR2/dist-1-5: assert npm >= 11.5.1, the OIDC registry-auth floor. Below it,
          # lib/utils/oidc.js does not exist, publish is ANONYMOUS, and the registry answers
          # 404 -- exactly how 4.0.0 failed four times while appearing to work. setup-node
          # defaults check-latest:false, so the toolcache decides which 24.x you get, and 8 of
          # the 27 released node 24.x lines bundle npm 11.3.0-11.4.2 (verified against
          # nodejs.org/dist/index.json). This worked by luck, not design.
          #
          # Multi-line output is REFUSED, not trimmed -- same standard FR5 applies to the
          # registry reply below, and for the same reason. A prerelease (11.5.1-pre.0) is
          # REFUSED too: it predates the release that first ships oidc.js, and truncating at
          # the first non-digit would have scored it as exactly 11.5.1. Field-compared rather
          # than `sort -V`: dist-1-3 had to disclose a BSD-vs-GNU sort basis gap; integers have
          # none. Components are capped at 9 digits so `[` cannot overflow and silently pass.
          NPM_VER_RAW=$(npm --version 2>/dev/null) || NPM_VER_RAW=""
          if [ "$(printf '%s' "$NPM_VER_RAW" | grep -c '')" -ne 1 ]; then
            echo "FATAL: npm --version returned ${NPM_VER_RAW:+multi-line }output; refusing to guess." >&2; exit 1
          fi
          NPM_VER="${NPM_VER_RAW#"${NPM_VER_RAW%%[![:space:]]*}"}"; NPM_VER="${NPM_VER%"${NPM_VER##*[![:space:]]}"}"
          if ! [[ "$NPM_VER" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
            echo "FATAL: npm version '$NPM_VER_RAW' is not a plain X.Y.Z release." >&2
            echo "  A prerelease such as 11.5.1-pre.0 predates the release shipping oidc.js." >&2
            exit 1
          fi
          NPM_MAJ=${NPM_VER%%.*}; NPM_REST=${NPM_VER#*.}; NPM_MIN=${NPM_REST%%.*}; NPM_PATCH=${NPM_REST#*.}
          if [ "$NPM_MAJ" -lt 11 ] \
            || { [ "$NPM_MAJ" -eq 11 ] && [ "$NPM_MIN" -lt 5 ]; } \
            || { [ "$NPM_MAJ" -eq 11 ] && [ "$NPM_MIN" -eq 5 ] && [ "$NPM_PATCH" -lt 1 ]; }; then
            echo "FATAL: npm $NPM_VER is below the OIDC registry-auth floor 11.5.1." >&2
            echo "  Below this floor npm publishes ANONYMOUSLY and the registry answers 404." >&2
            exit 1
          fi
          echo "npm floor: $NPM_VER >= 11.5.1 -- OK"

          # FR4/dist-1-5, part 1 -- the OIDC precondition. oidc.js returns undefined without
          # these and NEVER throws, so a missing `id-token: write` would surface only as a 404
          # at tag-push cost. Shape-checked, not merely present: a whitespace or malformed URL
          # passes a bare -z test while minting no token at all.
          if ! [[ "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" =~ ^https://[^[:space:]]+$ ]] \
             || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN//[[:space:]]/}" ]; then
            echo "FATAL: OIDC id-token endpoint is missing or malformed." >&2
            echo "  Needs 'permissions: id-token: write'. npm's oidc() returns undefined" >&2
            echo "  without it and never throws, so publish would proceed as nobody." >&2
            exit 1
          fi
          echo "OIDC precondition: id-token endpoint present -- OK"

          # FR4/dist-1-5, part 2 -- no credential may reach npm on this path.
          #
          # Checks EVERY npmrc npm reads, not just $NPM_CONFIG_USERCONFIG. An earlier draft
          # checked only that one file -- and since FR4 removes `registry-url:`, setup-node no
          # longer exports it, so the guard took its else branch, printed OK, and grepped
          # nothing. It was inert in exactly the state this change creates. Project .npmrc
          # OUTRANKS user config and is not gitignored, so it must be covered.
          #
          # Asserted against the FILES: `npm config get //registry.npmjs.org/:_authToken`
          # refuses protected keys and exits 1 whether the value is present OR absent, so it
          # cannot tell the two states apart -- the one thing this needs to do.
          #
          # Matches every credential spelling (_auth, _password, username all authenticate),
          # anchored to a config-key line so a comment mentioning _authToken does not abort a
          # clean publish. Unreadable candidates are FATAL, not skipped: `grep -q` returns 2
          # for "cannot read" and an `if` collapses that to "no match", reporting an
          # unreadable npmrc as verified-clean.
          #
          # Runs BEFORE the exchange: a successful oidc() does config.set() on the same key.
          # Covers: certfile|keyfile too -- publish.js:144 treats `certfile && keyfile` as
          # credentials exactly like a token. CR-only line endings are normalised first: npm's
          # `ini` splits on [\r\n]+ while grep splits on \n only, so a CR-only npmrc is a
          # credential npm honours and a bare grep would certify it clean. Paths come from npm
          # itself, not guesses, and are deduped.
          CRED_RE='^[[:space:]]*(//[^[:space:]]*:)?(_authToken|_auth|_password|username|certfile|keyfile)[[:space:]]*='
          NPMRC_CHECKED=0
          NPMRC_SEEN=""
          for npmrc_candidate in \
            "$(npm config get userconfig 2>/dev/null)" \
            "$(npm config get globalconfig 2>/dev/null)" \
            "${NPM_CONFIG_USERCONFIG:-}" "${NPM_CONFIG_GLOBALCONFIG:-}" \
            "$HOME/.npmrc" "$PWD/.npmrc"; do
            [ -n "$npmrc_candidate" ] && [ "$npmrc_candidate" != "undefined" ] || continue
            [ -e "$npmrc_candidate" ] || continue
            case ":$NPMRC_SEEN:" in *":$npmrc_candidate:"*) continue ;; esac
            NPMRC_SEEN="$NPMRC_SEEN:$npmrc_candidate"
            if [ ! -f "$npmrc_candidate" ] || [ ! -r "$npmrc_candidate" ]; then
              echo "FATAL: npmrc candidate '$npmrc_candidate' exists but is not a readable file." >&2; exit 1
            fi
            if tr '\r' '\n' < "$npmrc_candidate" | grep -Eq "$CRED_RE"; then
              echo "FATAL: '$npmrc_candidate' sets a credential key on the publish path." >&2
              echo "  setup-node exports NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX' when it is" >&2
              echo "  otherwise unset (authutil.ts:55-57), so npm sends THAT dummy as a bearer" >&2
              echo "  token and an OIDC decline is reported as *bad token*, not *no token*." >&2
              exit 1
            fi
            NPMRC_CHECKED=$((NPMRC_CHECKED+1))
          done

          # The environment outranks every npmrc, and ci.yml's own OIDC note warns that "a token
          # in the environment takes precedence over OIDC, which put 4.0.0 back on the token
          # path". Two vectors, both asserted:
          #   1. NODE_AUTH_TOKEN -- the specific variable setup-node exports.
          #   2. any npm_config_* / NPM_CONFIG_* credential key. npm reads config from the
          #      environment at HIGHER precedence than any npmrc, so a repo/org Variable or a
          #      prior composite action can supply one invisibly to a file-based check.
          # `npm config ls -l` does NOT surface env-supplied credentials (measured), which is
          # why this greps the environment directly rather than asking npm.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "FATAL: NODE_AUTH_TOKEN is set on the publish path." >&2
            echo "  A token in the environment takes precedence over OIDC. This job publishes" >&2
            echo "  via Trusted Publishing and must have no token at all." >&2
            exit 1
          fi
          # Matches on the ENV-VAR NAME with structural rules, because npm authenticates on
          # the RESOLVED config key and `#loadObject` runs `envReplace(key, this.env)` on every
          # key (@npmcli/config/lib/index.js:586) -- so `${VAR}` inside a key is expanded AFTER
          # any name-based regex has looked. Measured: `npm_config_//registry.npmjs.org/:${X}`
          # with `X=_authToken` delivers a working token while a credential-word regex sees
          # nothing. That vector is unbounded, so the rule is: reject any npm_config_* name that
          # is REWRITABLE (`${`) or nerf-darted (`//`, `:`) as well as any credential spelling.
          # Env outranks the user layer, so such a var shadows the token oidc() writes.
          #
          # Iterates NUL-framed names rather than grepping `env` output: `env` line-splits a
          # multi-line VALUE, so a benign var containing a newline could forge a match and abort
          # a release on a tag already spent. Measured before this was fixed.
          BAD_NPM_ENV=""
          while IFS= read -r -d '' npm_env_kv; do
            npm_env_name=${npm_env_kv%%=*}
            case $npm_env_name in [Nn][Pp][Mm]_[Cc][Oo][Nn][Ff][Ii][Gg]_*) ;; *) continue ;; esac
            shopt -s nocasematch
            if [[ $npm_env_name == *'${'* || $npm_env_name == *//* || $npm_env_name == *:* \
               || $npm_env_name =~ (_auth|_password|username|certfile|keyfile) ]]; then
              BAD_NPM_ENV="$BAD_NPM_ENV $npm_env_name"
            fi
            shopt -u nocasematch
          done < <(env -0)
          if [ -n "$BAD_NPM_ENV" ]; then
            echo "FATAL: npm_config_* credential or rewritable key(s) in the environment:$BAD_NPM_ENV" >&2
            echo "  npm reads config from the environment above every npmrc, so this takes" >&2
            echo "  precedence over OIDC -- the token-path regression that broke 4.0.0." >&2
            exit 1
          fi
          # Third vector: oidc.js:50 uses NPM_ID_TOKEN in place of the identity GitHub mints,
          # so a supplied value performs the exchange against an attacker-chosen assertion.
          # Neither of the checks above sees it.
          if [ -n "${NPM_ID_TOKEN:-}" ]; then
            echo "FATAL: NPM_ID_TOKEN is set on the publish path." >&2
            echo "  It overrides the ID token GitHub mints for this workflow (oidc.js:50)." >&2
            exit 1
          fi

          # Reports what was ACTUALLY inspected. An earlier version said "none sets a
          # credential" after inspecting ZERO files -- the same unearned positive claim R1
          # rejected one revision earlier, just with a different cause removed.
          if [ "$NPMRC_CHECKED" -eq 0 ]; then
            echo "npm credential check: no npmrc exists on any path npm reads; NODE_AUTH_TOKEN unset -- OK"
          else
            echo "npm credential check: $NPMRC_CHECKED npmrc file(s) inspected, none sets a credential; NODE_AUTH_TOKEN unset -- OK"
          fi

          # FR4/dist-1-5, part 3 -- a `npm publish --dry-run` OIDC gate was written here and
          # REMOVED at Round 2. Recorded so it is not re-attempted without the context:
          #   1. It read $DIST_TAG 61 lines before the FR1 block assigns it -- it would have
          #      run `npm publish --tag ""`. It could never have passed.
          #   2. Its stated benefit was false. This job only fires on `refs/tags/v*`, so the
          #      tag is ALREADY SPENT before any step here runs. It could not have converted a
          #      post-tag failure into a cheaper one; there is no pre-tag moment in this job.
          #   3. Its marginal value over the id-token precondition above is a better-worded
          #      error a few seconds earlier, at the cost of a second live OIDC exchange on
          #      the path that failed four times.
          # The pre-tag identity rehearsal belongs to Story 1.6 (FR19), which is where a tag
          # can be spent deliberately. Story 1.5's R1 was right that the exchange is NOT
          # single-use (execWorkspaces issues N per publish); it was wrong to conclude the
          # gate therefore belonged here.

          # FR3/dist-1-4: refuse to publish when the pushed tag does not name the version.
          # T41(c): `github.ref_name` appeared NOWHERE in this file, so tag v4.0.1 could ship
          # package.json 4.1.0-rc.1 -- BUG-15 shipped half its own acceptance text.
          #
          # Build metadata is NOT part of a release's identity: semver.valid("4.0.1+sha") is
          # "4.0.1", and FR1 strips it three lines below for dist-tag routing. Comparing on a
          # different basis here would make consecutive checks contradict each other.
          #
          # The strictness below is not decoration. A story-review layer defeated a laxer
          # draft: `[0-9]*.[0-9]*.[0-9]*` as a `case` glob accepted `01.2.3`, `1.2.3-+`,
          # `1.2.3+a+b` and `1.2.3-.`; `${TAG_NAME#v}` silently no-op'd on a tag with no `v`;
          # and guarding TAG_NAME with `:-` while reading VERSION bare was the same asymmetry
          # that made the FR5 guard fail open. Both operands are now validated identically.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ -z "${TAG_NAME:-}" ]; then
            echo "FATAL: TAG_NAME is empty; cannot verify the tag matches the version." >&2; exit 1
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "FATAL: VERSION is empty; cannot verify the tag matches the version." >&2; exit 1
          fi
          case "$TAG_NAME" in
            v*) ;;
            *) echo "FATAL: tag '$TAG_NAME' is not v-prefixed; refusing." >&2; exit 1 ;;
          esac
          TAG="${TAG_NAME#v}"
          if ! [[ "$TAG" =~ $SEMVER_RE ]]; then
            echo "FATAL: tag '$TAG_NAME' does not name a valid semver release." >&2; exit 1
          fi
          if ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "FATAL: package.json version '$VERSION' is not valid semver." >&2; exit 1
          fi
          if [ "${TAG%%+*}" != "${VERSION%%+*}" ]; then
            echo "FATAL: tag and version disagree -- tag '$TAG_NAME' names '${TAG%%+*}', package.json says '${VERSION%%+*}'." >&2
            exit 1
          fi
          # Build metadata: FR1 strips it from ONE operand to CLASSIFY a version. Stripping it from
          # BOTH to COMPARE them is a different act, and doing so blindly let `v4.0.1+abc123` publish
          # `4.0.1+def456` while reporting agreement -- the tag naming one commit, the tarball another.
          # Rule: if BOTH sides carry metadata it must match; if only one does, the tag still names the
          # release and CI is free to stamp a build. Caught by the R1 edge-case layer.
          case "$TAG:$VERSION" in
            *+*:*+*)
              if [ "$TAG" != "$VERSION" ]; then
                echo "FATAL: tag and version carry different build metadata -- tag '$TAG_NAME', package.json '$VERSION'." >&2
                exit 1
              fi ;;
          esac
          echo "Tag/version check: tag $TAG_NAME matches package.json $VERSION -- OK"
          case "${VERSION%%+*}" in
            *-*) DIST_TAG=rc ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Publishing $VERSION to dist-tag $DIST_TAG"

          # FR5/dist-1-3: refuse a semver-lower publish to `latest`. Without this, a maintenance
          # tag cut from an old branch (say v3.3.1) derives DIST_TAG=latest and downgrades every
          # 4.0.0 user. Nothing here read the dist-tag before, so this is a deliberate NEW read of
          # the registry. It fails CLOSED, matching the fresh-install job above: a transient
          # registry failure blocks a tag publish exactly as a real defect would, recoverable by
          # re-running. The one exception is E404 -- a package with nothing published yet has
          # nothing to downgrade, and this repo has renamed its published package once already.
          #
          # Every validation below closes a hole that a review layer actually drove through an
          # earlier draft. Do not "simplify" any of them:
          #   - an unbound package name made `npm view ""` return a REAL package called
          #     `undefined` (0.1.0) at exit 0, so the guard passed every downgrade;
          #   - `case "$X" in [0-9]*.[0-9]*.[0-9]*)` is a GLOB, not semver -- it accepted
          #     `1.2.3.4`, `1.2.3abc` and embedded newlines, which is why these are `[[ =~ ]]`;
          #   - a multi-line `version` bypassed the guard entirely, so CAND is validated as
          #     strictly as CURRENT;
          #   - a multi-line registry reply is REFUSED, not `head -1`-ed: head took the FIRST
          #     line, not the highest, and under `pipefail` it also SIGPIPEs npm on long replies;
          #   - `tr -d '[:space:]'` welded `3.0.0 9.9.9` into `3.0.09.9.9`, so trimming is done
          #     with parameter expansion instead;
          #   - `sort -V` ranks 4.1.0 BELOW 4.1.0-rc.1, the reverse of SemVer, so a prerelease
          #     on `latest` is refused by the shape check rather than compared wrongly.
          #
          # BSD-vs-GNU 'sort -V': RESOLVED 2026-08-23 by dist-1b-1 -- and NOT by a runner case,
          # because no runner case can resolve it. Executed:
          #   - 4.9.0 vs 4.10.0 yields 4.9.0 in BOTH input orders. Every version-sort compares
          #     digit runs numerically; that discriminates 'sort -V' from plain 'sort', not GNU
          #     from BSD. "Closing" the question on such a pair would prove nothing.
          #   - The two genuinely differ only on a numeric TIE, e.g. zero-padded 4.01.0 vs 4.1.0,
          #     where each implementation applies its own tie-break.
          # Those are excluded by the SHAPE CHECKS -- the one on CAND below, and the one on
          # CURRENT inside downgrade-guard.sh. Both reject leading zeros.
          #
          # NOT by gate 4's SEMVER_RE, which an earlier version of this comment credited:
          # SEMVER_RE constrains TAG/VERSION only. It never sees CURRENT, which arrives from the
          # registry, and the downgrade-guard-dry caller has no SEMVER_RE upstream at all.
          # So on the input space these checks admit -- canonical, non-zero-padded X.Y.Z triples --
          # the two implementations agree BY CONSTRUCTION. Relaxing either shape check re-opens it.
            if [ "$DIST_TAG" = "latest" ]; then
              PKG=$(node -p "require('./package.json').name" 2>/dev/null) || PKG=""
              case "$PKG" in ""|undefined) echo "FATAL: cannot determine package name." >&2; exit 1 ;; esac

              # CAND is validated HERE, before the registry read, and deliberately NOT inside
              # downgrade-guard.sh: on the E404 skip path below the script is never called, so a
              # check that lived only there would leave CAND unvalidated on exactly the path the
              # guard lets through. The script re-asserts it as a contract check on its own input.
              CAND="${VERSION%%+*}"
              # Same regex as downgrade-guard.sh's: rejects LEADING ZEROS. The sort argument
              # below depends on both operands being canonical, and this is CAND's only check
              # on the E404 skip path, where the script is never called.
              if ! [[ "$CAND" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "FATAL: version '$VERSION' is not a plain X.Y.Z release; refusing." >&2; exit 1
              fi

              # T46 follow-up: a well-formed E404 proves "npm said 404", NOT "this package is
              # unpublished". A misdirected or stale registry 404s for a package that IS published
              # -- executed: `npm_config_registry=https://registry.npmjs.org/nope/ npm view
              # convoke-agents dist-tags.latest` emits a textbook `npm error code E404` while
              # `latest` is 4.0.0. Trusting it would skip the guard and let a downgrade through.
              #
              # A second probe does NOT discriminate (measured -- it 404s in both cases). What does
              # is the RESOLVED REGISTRY, so pin it before the read and refuse to interpret any 404
              # that did not come from the expected origin.
              REGISTRY=$(npm config get registry)
              if [ "$REGISTRY" != "https://registry.npmjs.org/" ]; then
                echo "FATAL: unexpected registry '$REGISTRY'; refusing to interpret its responses." >&2
                exit 1
              fi

              VIEW_ERR=$(mktemp) || { echo "FATAL: mktemp failed; cannot run the downgrade guard." >&2; exit 1; }
              trap 'rm -f "$VIEW_ERR"' EXIT
              GUARD_SKIP=""
              if CURRENT=$(npm view "$PKG" dist-tags.latest --no-color 2>"$VIEW_ERR"); then :; else
                # T46: this MUST anchor on npm's error-CODE line. A bare `grep 'E404|404 Not Found'`
                # over the whole stream matches unrelated 404 noise -- e.g. an E500 payload carrying
                # `npm warn 404 Not Found - GET .../-/npm/v1/notifications` -- and silently disables
                # the only protection between a lower version and `latest`. Demonstrated failing.
                #
                # The anchor depends on npm >= 10's `npm error` prefix; npm 9 emits `npm ERR!`.
                # Gate 1 above enforces npm >= 11.5.1 on this job, so the dependency is satisfied
                # here. The `downgrade-guard-dry` job does NOT exercise this branch at all -- it
                # makes no network call -- so this anchor is proven by fixture only.
                # npm URL-encodes the scope separator: @scope/name -> @scope%2fname. Measured.
                # convoke-agents is unscoped today, but building the expected URL without this
                # would make a first scoped publish FATAL with "could not reach the registry".
                PKG_URL="${PKG//\//%2f}"
                if grep -qE '^npm error code E404$' "$VIEW_ERR" \
                   && grep -qF "404 Not Found - GET ${REGISTRY}${PKG_URL}" "$VIEW_ERR"; then
                  # BOTH required: the error CODE line (not 404 noise inside another error), AND a
                  # 404 whose URL is exactly <expected-registry><package> (not a sub-resource such
                  # as /-/npm/v1/notifications, and not a misdirected path).
                  echo "Downgrade guard: skipped -- $REGISTRY returned E404 for $PKG at its own URL, so it has no published version yet."
                  GUARD_SKIP=1
                else
                  echo "FATAL: could not reach the registry for $PKG." >&2
                  head -c 2000 "$VIEW_ERR" >&2; exit 1
                fi
              fi

              if [ -z "$GUARD_SKIP" ]; then
                # ONE copy of the comparison, shared with the `downgrade-guard-dry` job.
                # Inputs are NAMED, never positional: a transposed positional pair would invert
                # every verdict silently while the dry matrix stayed green.
                GUARD_CAND="$CAND" GUARD_CURRENT="$CURRENT" GUARD_PKG="$PKG" \
                  ./scripts/ci/downgrade-guard.sh
              fi
            else
              echo "Downgrade guard: skipped (DIST_TAG=$DIST_TAG, prerelease does not move 'latest')"
            fi

          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose
