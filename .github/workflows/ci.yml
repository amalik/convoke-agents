name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-node-${{ matrix.node-version }}
          path: |
            npm-debug.log
            tests/
          retention-days: 14

  burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Burn-in loop (5 iterations)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Burn-in iteration $i/5 ==="
            npm test || exit 1
            npm run test:integration || exit 1
          done
          echo "=== All 5 burn-in iterations passed ==="

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify npm pack contents
        run: npm pack --dry-run 2>&1 | tee pack-output.txt

      - name: Check index.js runs
        run: node index.js

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytest pyyaml ruff

      - name: Lint Python files
        run: ruff check _bmad/ --config ruff.toml

      # Enumerate mechanically rather than hardcoding paths: BMAD updates move,
      # rename, and retire skill directories wholesale (a16fa340 .bak'd the entire
      # BMB/core Python surface and relocated bmad-distillator under core/skills/),
      # which turned a stale path list into `pytest: exit 4` for six weeks.
      # See project-context.md rule `mechanical-research-enumeration`.
      - name: Run Python tests (BMB + Core)
        run: |
          # read loop rather than `mapfile`: mapfile is a bash 4+ builtin, so it
          # cannot be simulated locally on macOS (bash 3.2). Keep this step
          # runnable on a dev machine — an unverifiable CI step is how this
          # enumeration rotted unnoticed in the first place.
          PY_TESTS=()
          while IFS= read -r f; do PY_TESTS+=("$f"); done < <(
            find _bmad -type f \( -name 'test_*.py' -o -name 'test-*.py' \) \
              -not -path '*/node_modules/*' | sort
          )
          if [ "${#PY_TESTS[@]}" -eq 0 ]; then
            echo "::error::No Python test files found under _bmad/ — enumeration is broken or the suite was retired wholesale."
            exit 1
          fi
          echo "Discovered ${#PY_TESTS[@]} Python test file(s):"
          printf '  %s\n' "${PY_TESTS[@]}"
          python -m pytest "${PY_TESTS[@]}" -v

  publish:
    needs: [lint, test, python-test, coverage, security, package-check]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
