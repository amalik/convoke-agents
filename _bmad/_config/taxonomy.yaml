# Artifact Governance Taxonomy Configuration
# Schema version: 1
# Created by: ag-1-2-taxonomy-configuration
#
# This file is the single source of truth for initiative IDs, artifact types,
# and historical name aliases used by the governance system.

# Initiative IDs
# - platform: Read-only. Updated by Convoke releases. Do not edit manually.
# - user: Operator-managed. Add custom initiative IDs here (one per line).
#   Rules: lowercase alphanumeric with optional dashes, no spaces, no special characters.
initiatives:
  platform:
    - vortex
    - gyre
    - bmm
    - forge
    - helm
    - enhance
    - loom
    - convoke
  user: []

# Artifact type identifiers
# Used by naming convention: {initiative}-{artifact_type}[-{qualifier}]-{date}.md
# Rules: lowercase alphanumeric with optional dashes.
artifact_types:
  - prd
  - epic
  - arch
  - adr
  - persona
  - lean-persona
  - empathy-map
  - problem-def
  - hypothesis
  - experiment
  - signal
  - decision
  - scope
  - pre-reg
  - sprint
  - brief
  - vision
  - report
  - research
  - story
  - spec
  - note
  # 'covenant' — document type for commitment/rights artifacts.
  # Qualifier test (both must hold):
  #   (1) Expresses commitments/rights binding multiple parties (not implementation details)
  #   (2) Compliance with the document is testable/auditable against explicit criteria
  # Distinct from 'spec' (implementation-focused) in metabolic rate and audience:
  # covenants evolve slowly as principles; specs evolve tactically with code.
  # The Convoke Operator Covenant is the example. It WAS authored (oc-1-4) and it now lives in
  # source-owned space at `_bmad/bme/covenant/covenant-operator.md` — story dist-2.3b. It is in
  # `files[]`, so it reaches the published package; it does NOT yet reach an installed project,
  # because no install path copies it. That is the same gap `_bmad/bme/_portability/` has and is
  # dist-2.6's scope. (An earlier version of this comment said "where it ships to operators",
  # which overstated it: the tarball is not the operator's project.)
  # The Covenant is therefore no longer inside the directories the artifact scanner walks
  # (`planning-artifacts`, `vortex-artifacts`, `gyre-artifacts`; see artifact-utils.js
  # `includeDirs`), so no scanned file carries `artifact_type: covenant` today. The moved file
  # keeps its frontmatter: per ADR-003 the class is a property of the artifact, not of the
  # directory. An earlier version of this comment said the Covenant was "to be authored" and that
  # "until then, this type has no files" — the first half was stale from oc-1-4, and the second is
  # now true again for an entirely different reason.
  - covenant

# Historical name aliases (migration-only)
# Maps old initiative names found in existing filenames to canonical IDs.
# Used by the migration script to resolve historical naming variants.
# The portfolio skill does NOT consume aliases — post-migration, all files use canonical IDs.
aliases:
  strategy-perimeter: helm
  strategy: helm
  strategic: helm
  strategic-navigator: helm
  strategic-practitioner: helm
  team-factory: loom
